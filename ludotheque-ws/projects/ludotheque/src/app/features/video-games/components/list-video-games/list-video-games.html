@let videoGamesResponse = videoGamesResponse$ | async;

<h1>{{ title() }}</h1>

<button (click)="changeTitle()">Changer le titre</button>

@if (videoGamesResponse) {
  <ldk-table-video-game
    [videoGames]="videoGamesResponse.results"
    (toEdit)="editOne($event)"
  />
}

@let videoGameToEdit = videoGameToBeEditable();
@if (videoGameToEdit) {
  <ldk-edit-video-game
    [videoGame]="videoGameToEdit"
  />
}
